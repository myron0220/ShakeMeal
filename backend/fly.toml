app = "shakemeal-api"
primary_region = "sjc"   # San Jose — closest to SF mock data coordinates

[build]
  dockerfile = "docker/Dockerfile"

[env]
  PORT = "8080"
  ENV  = "production"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
