name: ShakeMeal
options:
  bundleIdPrefix: com.shakemeal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: "gfs28ru6av"
    CODE_SIGN_STYLE: Automatic

targets:
  ShakeMeal:
    type: application
    platform: iOS
    sources:
      - path: ShakeMeal
    info:
      path: ShakeMeal/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: "ShakeMeal needs your location to find nearby restaurants."
        NSMotionUsageDescription: "ShakeMeal uses motion to detect when you shake your device."
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # allows http://localhost in DEBUG builds
    # entitlements: Sign in with Apple requires paid developer account — re-enable before App Store submission
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shakemeal.app
        INFOPLIST_FILE: ShakeMeal/Info.plist
        # CODE_SIGN_ENTITLEMENTS: ShakeMeal/ShakeMeal.entitlements  # re-enable with paid account
