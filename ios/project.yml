name: ShakeMeal
options:
  bundleIdPrefix: com.shakemeal
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 5.9
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""          # Add your Apple Team ID here

targets:
  ShakeMeal:
    type: application
    platform: iOS
    sources:
      - path: ShakeMeal
    info:
      path: ShakeMeal/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        NSLocationWhenInUseUsageDescription: "ShakeMeal needs your location to find nearby restaurants."
        NSMotionUsageDescription: "ShakeMeal uses motion to detect when you shake your device."
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # allows http://localhost in DEBUG builds
    entitlements:
      path: ShakeMeal/ShakeMeal.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shakemeal.app
        INFOPLIST_FILE: ShakeMeal/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShakeMeal/ShakeMeal.entitlements
